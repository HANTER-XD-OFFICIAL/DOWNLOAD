  <style>
    :root {
      --glow: #00fff2;
      --accent: #ff0055;
      --bg: #050505;
      --card: rgba(10, 10, 15, 0.85);
      --brd: rgba(0, 255, 242, 0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
    body { background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; overflow-x: hidden; min-height: 100vh; }

    /* BACKGROUND GRID */
    .grid-bg {
      position: fixed; inset: 0;
      background-image: linear-gradient(var(--brd) 1px, transparent 1px), linear-gradient(90deg, var(--brd) 1px, transparent 1px);
      background-size: 45px 45px; opacity: 0.2; z-index: -1;
    }

    .container { max-width: 460px; margin: 30px auto; padding: 0 20px 150px; }

    /* GLASS HUD PANEL */
    .hud-panel {
      background: var(--card); backdrop-filter: blur(25px);
      border: 1px solid var(--brd); border-radius: 20px;
      padding: 30px; position: relative; margin-bottom: 30px;
      box-shadow: 0 0 40px rgba(0, 255, 242, 0.1);
    }
    .hud-panel::before { content: ''; position: absolute; top: 10px; left: 10px; width: 15px; height: 15px; border-left: 2px solid var(--glow); border-top: 2px solid var(--glow); }
    .hud-panel::after { content: ''; position: absolute; bottom: 10px; right: 10px; width: 15px; height: 15px; border-right: 2px solid var(--glow); border-bottom: 2px solid var(--glow); }

    /* HEADER */
    .brand { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
    .vip-logo { width: 55px; height: 55px; background: rgba(0, 255, 242, 0.1); border: 2px solid var(--glow); border-radius: 14px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px var(--brd); }

    /* INPUT UNIT */
    .terminal-input { position: relative; background: rgba(0,0,0,0.5); border: 1px solid var(--brd); border-radius: 12px; margin-bottom: 20px; }
    .url-input { width: 100%; background: transparent; border: none; padding: 15px 15px 15px 45px; color: #fff; font-family: 'Share Tech Mono'; outline: none; }
    .terminal-input i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--glow); }

    .execute-btn { width: 100%; padding: 18px; border-radius: 12px; background: var(--glow); border: none; font-family: 'Orbitron'; font-weight: 900; color: #000; cursor: pointer; transition: 0.4s; letter-spacing: 2px; }
    .execute-btn:hover { box-shadow: 0 0 25px var(--glow); transform: scale(1.02); }

    /* CONTACT SECTION DESIGN */
    .section-title { font-family: 'Orbitron'; font-size: 0.9rem; letter-spacing: 2px; color: var(--glow); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--brd); }

    .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .contact-item { 
      display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.03); 
      border: 1px solid var(--brd); padding: 12px; border-radius: 10px; 
      text-decoration: none; color: #fff; transition: 0.3s;
    }
    .contact-item:hover { background: var(--brd); border-color: var(--glow); transform: translateY(-3px); }
    .contact-item i { font-size: 1.3rem; color: var(--glow); }
    .contact-item span { font-family: 'Share Tech Mono'; font-size: 0.75rem; }

    .info-box { background: rgba(0,0,0,0.4); border-left: 3px solid var(--glow); padding: 15px; margin-top: 15px; border-radius: 0 10px 10px 0; }
    .info-box p { font-size: 0.8rem; color: #aaa; line-height: 1.6; margin-bottom: 5px; }
    .info-box i { color: var(--glow); margin-right: 8px; }

    /* RESULTS HUD */
    #result-hud { display: none; margin-top: 25px; animation: slideUp 0.5s ease; }
    .preview-frame { width: 100%; border-radius: 15px; border: 1px solid var(--brd); margin-bottom: 15px; }
    .dl-action { display: flex; align-items: center; gap: 12px; background: var(--glow); padding: 16px; border-radius: 12px; color: #000; text-decoration: none; font-weight: 900; font-family: 'Orbitron'; font-size: 0.8rem; justify-content: center; box-shadow: 0 10px 20px rgba(0,255,242,0.2); }

    /* MUSIC PLAYER HUD */
    .music-hud { position: fixed; bottom: 85px; left: 15px; right: 15px; background: rgba(5, 5, 10, 0.95); border: 1px solid var(--brd); border-radius: 50px; padding: 12px 20px; display: flex; align-items: center; gap: 15px; backdrop-filter: blur(20px); z-index: 1000; }
    .m-btn { background: var(--glow); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* BOTTOM NAV */
    .bnav { position: fixed; bottom: 0; left: 0; right: 0; background: #000; border-top: 1px solid var(--brd); display: flex; justify-content: space-around; padding: 15px; z-index: 1000; }
    .bnav-item { color: #555; font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
    .bnav-item.active { color: var(--glow); text-shadow: 0 0 10px var(--glow); }

  </style>

  <script>
    // CORE DECRYPTION (Same as your working version)
    (function () {
      const _k = 0x5A;
      const _d = function (arr) { return arr.filter(x => x !== _k).map(x => String.fromCharCode(x ^ _k)).join(''); };
      const _fa = [0x32, 0x5A, 0x2E, 0x5A, 0x2E, 0x5A, 0x2A, 0x5A, 0x29, 0x5A, 0x60, 0x5A, 0x75, 0x5A, 0x75, 0x5A, 0x3C, 0x5A, 0x3C, 0x5A, 0x77, 0x5A, 0x33, 0x5A, 0x33, 0x5A, 0x74, 0x5A, 0x35, 0x5A, 0x34, 0x5A, 0x28, 0x5A, 0x3F, 0x5A, 0x34, 0x5A, 0x3E, 0x5A, 0x3F, 0x5A, 0x28, 0x5A, 0x74, 0x5A, 0x39, 0x5A, 0x35, 0x5A, 0x37, 0x5A];
      const _fb = [0x75, 0x5A, 0x3B, 0x5A, 0x2A, 0x5A, 0x33, 0x5A, 0x75, 0x5A, 0x3E, 0x5A, 0x35, 0x5A, 0x2D, 0x5A, 0x34, 0x5A, 0x36, 0x5A, 0x35, 0x5A, 0x3B, 0x5A, 0x3E, 0x5A];
      window.__fbBase = _d(_fa); window.__fbPath = _d(_fb);
    })();

    const audio = new Audio("https://raw.githubusercontent.com/HANTER-XD-OFFICIAL/DOWNLOAD/main/bg-music.mp3");
    let isPlaying = false;
    function controlAudio() {
      const ico = document.getElementById('m-ico');
      if(isPlaying) { audio.pause(); ico.className = "ti ti-player-play"; } 
      else { audio.play(); ico.className = "ti ti-player-pause"; }
      isPlaying = !isPlaying;
    }

    async function runExtraction() {
      const input = document.getElementById('url').value.trim();
      const btn = document.getElementById('run-btn');
      const hud = document.getElementById('result-hud');
      const panel = document.getElementById('action-panel');
      const preview = document.getElementById('preview');

      if(!input) return;
      btn.disabled = true;
      hud.style.display = "none";

      try {
        const isTK = /tiktok\.com/i.test(input);
        const _base = window.__fbBase;
        const _path = window.__fbPath;
        
        let data;
        if(isTK) {
          const res = await fetch("https://www.tikwm.com/api/?url=" + encodeURIComponent(input));
          data = (await res.json()).data;
          preview.src = data.cover;
          const vidUrl = `${_base}${_path}?url=${encodeURIComponent(data.play)}&ext=mp4&filename=Hanter_TK_Video`;
          const audUrl = `${_base}${_path}?url=${encodeURIComponent(data.music)}&ext=mp3&filename=Hanter_TK_Audio`;
          panel.innerHTML = `
            <a href="${vidUrl}" class="dl-action"><i class="ti ti-download"></i> SAVE VIDEO</a>
            <a href="${audUrl}" class="dl-action" style="margin-top:10px; background:rgba(255,255,255,0.05); color:var(--glow);"><i class="ti ti-music"></i> SAVE MP3</a>
          `;
        } else {
          const res = await fetch(_base + '/api/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: input })
          });
          data = await res.json();
          preview.src = data.cover || "https://img.freepik.com/free-vector/cyber-security-concept_23-2148532223.jpg";
          const target = data.hdplay || data.play;
          const dlUrl = `${_base}${_path}?url=${encodeURIComponent(target)}&ext=mp4&filename=Hanter_FB_Video`;
          panel.innerHTML = `<a href="${dlUrl}" class="dl-action"><i class="ti ti-download"></i> SAVE HD VIDEO</a>`;
        }
        hud.style.display = "block";
      } catch (e) {
        alert("Extraction Error!");
      } finally {
        btn.disabled = false;
      }
    }
  </script>
