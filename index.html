<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ULTRA-SAVE PRO | HANTER-XD</title>
  
  <!-- MUSIC SOURCE FROM YOUR GITHUB -->
  <!-- MUSIC_SRC: https://raw.githubusercontent.com/HANTER-XD-OFFICIAL/DOWNLOAD/main/bg-music.mp3 -->
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    :root {
      --primary: #00f7ff;
      --accent: #ff007b;
      --bg: #020205;
      --card: rgba(10, 15, 25, 0.9);
      --brd: rgba(0, 247, 255, 0.25);
    }

    body { 
      background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; 
      margin: 0; min-height: 100vh; overflow-x: hidden;
    }

    /* CUSTOM SVG LOGO STYLE */
    .logo-container {
      width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 247, 255, 0.1);
      border: 2px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 0 15px var(--brd);
    }

    /* VIP HEADER */
    .header {
      max-width: 450px; margin: 0 auto;
      padding: 20px 15px; display: flex; align-items: center; gap: 15px;
      border-bottom: 1px solid var(--brd);
    }

    .dev-meta { flex: 1; }
    .dev-meta h1 { font-family: 'Orbitron'; font-size: 0.9rem; margin: 0; letter-spacing: 1px; }
    .badge { 
      font-size: 0.55rem; background: linear-gradient(90deg, var(--accent), var(--primary));
      padding: 2px 8px; border-radius: 4px; color: #000; font-weight: 900;
    }

    /* MAIN INTERFACE */
    .container { max-width: 450px; margin: 30px auto; padding: 0 15px; }
    .card {
      background: var(--card); backdrop-filter: blur(20px);
      border: 1px solid var(--brd); border-radius: 25px; padding: 30px 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8); position: relative;
    }

    .input-wrap { position: relative; margin: 25px 0; }
    .input-wrap i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); }
    .url-input {
      width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5);
      border: 1px solid var(--brd); padding: 15px 15px 15px 45px;
      border-radius: 12px; color: #fff; font-family: 'Rajdhani'; font-size: 1rem;
    }

    .btn {
      width: 100%; padding: 16px; border-radius: 12px; border: none;
      background: var(--primary); color: #000; font-family: 'Orbitron';
      font-weight: 900; cursor: pointer; transition: 0.3s; letter-spacing: 1px;
    }

    /* MUSIC PLAYER ORB */
    .music-orb {
      position: fixed; bottom: 85px; left: 20px; right: 20px;
      background: rgba(0,0,0,0.9); border: 1px solid var(--brd);
      border-radius: 50px; padding: 10px 20px; display: flex; align-items: center; gap: 12px;
      backdrop-filter: blur(15px); transform: translateY(150px); transition: 0.5s;
    }
    .music-orb.active { transform: translateY(0); }

    .disc {
      width: 40px; height: 40px; background: var(--primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: rotate 4s linear infinite paused;
    }
    .disc.playing { animation-play-state: running; }
    @keyframes rotate { 100% { transform: rotate(360deg); } }

    /* RESULTS */
    #result { display: none; margin-top: 25px; }
    .dl-btn {
      display: flex; align-items: center; gap: 10px; background: rgba(0,247,255,0.05);
      border: 1px solid var(--brd); padding: 12px; border-radius: 12px;
      color: #fff; text-decoration: none; margin-bottom: 10px; transition: 0.3s;
    }
    .dl-btn:hover { background: var(--primary); color: #000; }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <!-- UNIQUE VIP LOGO (SVG) -->
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#00f7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/>
      </svg>
    </div>
    <div class="dev-meta">
      <h1>HANTER-XD OFFICIAL</h1>
      <span class="badge">VIP DEVELOPER</span>
    </div>
    <i class="ti ti-activity" style="color:var(--primary)"></i>
  </header>

  <div class="container">
    <div class="card">
      <div style="font-family:'Share Tech Mono'; color:var(--primary); font-size:0.7rem;">// SYSTEM_ACCESS: GRANTED</div>
      <h2 style="font-family:'Orbitron'; font-size:1.2rem; margin: 15px 0 5px;">ULTRA-SAVE PRO</h2>
      <p style="font-size:0.8rem; color:#888; margin-bottom:20px;">Premium Multi-Platform Downloader Core</p>

      <div class="input-wrap">
        <i class="ti ti-link"></i>
        <input type="text" id="url" class="url-input" placeholder="Paste URL (TikTok / Facebook)">
      </div>

      <button class="btn" id="dl-btn" onclick="download()">EXECUTE EXTRACTION</button>

      <div id="result">
        <img id="thumb" style="width:100%; border-radius:15px; margin: 20px 0; border:1px solid var(--brd);">
        <div id="links"></div>
      </div>
    </div>
  </div>

  <div class="music-orb" id="orb">
    <div class="disc" id="disc">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div style="flex:1">
      <div style="font-family:'Orbitron'; font-size:0.55rem; color:var(--primary)">HANTER_STREAM.EXE</div>
      <div style="font-size:0.65rem; color:#888;">Playing: Premium Background Audio</div>
    </div>
    <button onclick="toggleMusic()" id="m-btn" style="background:var(--primary); border:none; width:35px; height:35px; border-radius:50%; cursor:pointer;">
      <i class="ti ti-player-play" id="m-icon" style="color:#000"></i>
    </button>
  </div>

  <script>
    // CORE DECRYPTION (Same as your working version)
    (function () {
      const _k = 0x5A;
      const _d = function (arr) { return arr.filter(x => x !== _k).map(x => String.fromCharCode(x ^ _k)).join(''); };
      const _fa = [0x32, 0x5A, 0x2E, 0x5A, 0x2E, 0x5A, 0x2A, 0x5A, 0x29, 0x5A, 0x60, 0x5A, 0x75, 0x5A, 0x75, 0x5A, 0x3C, 0x5A, 0x3C, 0x5A, 0x77, 0x5A, 0x33, 0x5A, 0x33, 0x5A, 0x74, 0x5A, 0x35, 0x5A, 0x34, 0x5A, 0x28, 0x5A, 0x3F, 0x5A, 0x34, 0x5A, 0x3E, 0x5A, 0x3F, 0x5A, 0x28, 0x5A, 0x74, 0x5A, 0x39, 0x5A, 0x35, 0x5A, 0x37, 0x5A];
      const _fb = [0x75, 0x5A, 0x3B, 0x5A, 0x2A, 0x5A, 0x33, 0x5A, 0x75, 0x5A, 0x3E, 0x5A, 0x35, 0x5A, 0x2D, 0x5A, 0x34, 0x5A, 0x36, 0x5A, 0x35, 0x5A, 0x3B, 0x5A, 0x3E, 0x5A];
      window.__fbBase = _d(_fa); window.__fbPath = _d(_fb);
    })();

    // MUSIC CONFIG
    const audio = new Audio("https://raw.githubusercontent.com/HANTER-XD-OFFICIAL/DOWNLOAD/main/bg-music.mp3");
    let isPlaying = false;

    setTimeout(() => { document.getElementById('orb').classList.add('active'); }, 2000);

    function toggleMusic() {
      const icon = document.getElementById('m-icon');
      const disc = document.getElementById('disc');
      if(isPlaying) {
        audio.pause();
        icon.className = "ti ti-player-play";
        disc.classList.remove('playing');
      } else {
        audio.play();
        icon.className = "ti ti-player-pause";
        disc.classList.add('playing');
      }
      isPlaying = !isPlaying;
    }

    async function download() {
      const url = document.getElementById('url').value;
      const btn = document.getElementById('dl-btn');
      if(!url) return;
      
      btn.innerText = "EXTRACTING...";
      btn.disabled = true;

      try {
        const isTikTok = /tiktok\.com/i.test(url);
        let api = isTikTok ? `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}` : `${window.__fbBase}/api/download`;
        
        let res;
        if(isTikTok) {
          res = await (await fetch(api)).json();
          const data = res.data;
          document.getElementById('thumb').src = data.cover;
          document.getElementById('links').innerHTML = `
            <a href="${data.play}" class="dl-btn" target="_blank"><i class="ti ti-video"></i> VIDEO (NO WATERMARK)</a>
            <a href="${data.music}" class="dl-btn" target="_blank"><i class="ti ti-music"></i> AUDIO (MP3)</a>
          `;
        } else {
          res = await (await fetch(api, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          })).json();
          document.getElementById('links').innerHTML = `<a href="${window.__fbBase + window.__fbPath}?url=${encodeURIComponent(res.hdplay || res.play)}&ext=mp4" class="dl-btn" target="_blank"><i class="ti ti-video"></i> DOWNLOAD HD VIDEO</a>`;
        }
        document.getElementById('result').style.display = 'block';
      } catch (e) {
        alert("Error in extraction!");
      } finally {
        btn.innerText = "EXECUTE EXTRACTION";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
