<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00e5ff">
  <meta name="referrer" content="no-referrer">
  <title>ULTRA-SAVE PRO | CORE ENGINE</title>

  <!-- 
    [ GITHUB CONFIGURATION ]
  -->
  <!-- THEME_COLOR: 0, 229, 255 -->
  <!-- TIKTOK_LINK: https://www.tiktok.com/ -->
  <!-- FB_LINK: https://www.facebook.com/ -->
  <!-- MUSIC_SRC: https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/audio.mp3 -->
  <!-- PROFILE_PIC: https://cdn-icons-png.flaticon.com/512/8922/8922789.png -->
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    :root {
      --a: #00e5ff;
      --ag: rgba(0, 229, 255, 0.7);
      --ad: rgba(0, 229, 255, 0.1);
      --ab: rgba(0, 229, 255, 0.35);
      --bg0: #030407;
      --bg1: #07080f;
      --brd: rgba(255, 255, 255, 0.05);
      --brda: rgba(0, 229, 255, 0.28);
      --txt: #e8e8f0;
      --txm: #8888aa;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background: var(--bg0); color: var(--txt); overflow-x: hidden; min-height: 100vh; }
    
    .scanline { position: fixed; inset: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--ag), transparent); z-index: 9; pointer-events: none; animation: scanDown 8s linear infinite; }
    @keyframes scanDown { 0% { top: -5px; } 100% { top: 100vh; } }
    
    #preloader { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s ease; }
    #preloader.out { opacity: 0; visibility: hidden; }

    .wrap { width: 100%; max-width: 430px; margin: 0 auto; padding: 20px 15px 100px; position: relative; z-index: 2; }
    .card { background: var(--bg1); border: 1px solid var(--brd); border-radius: 16px; padding: 25px 20px; margin-bottom: 15px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--a), transparent); }

    .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .logo-img { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--brda); object-fit: cover; }

    .input-wrap { position: relative; margin: 20px 0; }
    .url-input { width: 100%; padding: 15px 15px 15px 45px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--brd); color: #fff; outline: none; transition: 0.3s; }
    .url-input:focus { border-color: var(--a); box-shadow: 0 0 15px var(--ad); }
    .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--a); }

    .dl-btn { width: 100%; padding: 16px; border-radius: 10px; background: var(--a); color: #000; font-family: 'Orbitron', sans-serif; font-weight: 700; border: none; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
    .dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* STATUS & LOADER */
    .status-container { display: none; margin-top: 15px; flex-direction: column; align-items: center; gap: 10px; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--ad); border-top-color: var(--a); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* RESULT AREA */
    #result-box { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--brd); }
    .preview-thumb { width: 100%; border-radius: 12px; border: 1px solid var(--brda); margin-bottom: 15px; box-shadow: 0 0 20px var(--ad); }
    
    .media-btn { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--ad); border: 1px solid var(--brda); border-radius: 12px; color: #fff; text-decoration: none; margin-bottom: 10px; transition: 0.2s; }
    .media-btn:hover { background: var(--a); color: #000; }
    .media-btn i { font-size: 1.4rem; color: var(--a); }
    .media-btn:hover i { color: #000; }

    .img-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
    .img-item { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid var(--brd); }

    /* MUSIC PLAYER */
    #musicNotif { position: fixed; bottom: 85px; left: 15px; right: 15px; background: rgba(10,12,18,0.95); border: 1px solid var(--brda); border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 12px; transform: translateY(200px); transition: 0.5s; z-index: 1000; backdrop-filter: blur(10px); }
    #musicNotif.show { transform: translateY(0); }
    .mn-img { width: 50px; height: 50px; border-radius: 12px; animation: spinRotate 4s linear infinite paused; border: 1px solid var(--brda); }
    .mn-img.playing { animation-play-state: running; }
    @keyframes spinRotate { 100% { transform: rotate(360deg); } }

    .bnav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,6,10,0.95); border-top: 1px solid var(--brd); display: flex; justify-content: space-around; padding: 12px; z-index: 100; }
    .bnav-item { color: var(--txm); font-size: 20px; }
  </style>
</head>

<body>
  <div class="scanline"></div>

  <div id="preloader">
    <div class="pl-logo" style="font-family:'Orbitron'">ULTRA-<span>SAVE</span></div>
    <div style="color:var(--a); font-family:'Share Tech Mono'; margin-top:10px;" id="pl-pct">0%</div>
  </div>

  <div class="wrap">
    <div class="logo-row">
      <img src="" id="main-logo" class="logo-img">
      <div style="font-family:'Orbitron'; font-weight:900; letter-spacing:2px; font-size:1.2rem;">ULTRA-<span style="color:var(--a)">SAVE</span></div>
    </div>

    <div class="card">
      <div style="font-family:'Share Tech Mono'; color:var(--a); font-size:0.7rem; letter-spacing:3px; margin-bottom:10px;">// CORE_ENGINE_V1.0</div>
      <h2 style="font-family:'Orbitron'; margin-bottom:10px; font-size: 1.4rem;">Media Extractor</h2>
      
      <div class="input-wrap">
        <i class="ti ti-link input-icon"></i>
        <input type="text" id="url" class="url-input" placeholder="Paste link here...">
      </div>
      
      <button class="dl-btn" id="submit-btn" onclick="downloadVideo()">START EXTRACTION</button>
      
      <div id="loader" class="status-container">
        <div class="spinner"></div>
        <span style="font-family:'Share Tech Mono'; font-size:0.7rem; color:var(--a)">ACCESSING REMOTE SERVERS...</span>
      </div>

      <!-- Result View -->
      <div id="result-box">
        <img id="vid-thumb" class="preview-thumb" src="" style="display:none;">
        <div id="img-grid" class="img-grid" style="display:none;"></div>
        
        <a id="vid-btn" href="#" class="media-btn" style="display:none;">
          <i class="ti ti-video"></i>
          <div><div style="font-weight:bold; font-size:0.9rem;">DOWNLOAD VIDEO</div><small style="opacity:0.6; font-size:0.6rem;">HD • MP4 • NO WATERMARK</small></div>
        </a>

        <a id="aud-btn" href="#" class="media-btn" style="display:none;">
          <i class="ti ti-music"></i>
          <div><div style="font-weight:bold; font-size:0.9rem;">DOWNLOAD AUDIO</div><small style="opacity:0.6; font-size:0.6rem;">High Quality • MP3</small></div>
        </a>
      </div>
    </div>
  </div>

  <div id="musicNotif">
    <img src="" id="music-img" class="mn-img">
    <div style="flex:1">
      <div style="font-size:0.8rem; font-weight:bold;">CORE_AUDIO.EXE</div>
      <div style="font-size:0.6rem; color:var(--txm);" id="music-status">Status: Waiting</div>
    </div>
    <button onclick="toggleMusic()" id="play-btn" style="background:var(--a); border:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;"><i class="ti ti-player-play" style="color:#000"></i></button>
  </div>

  <nav class="bnav">
    <i class="ti ti-home bnav-item" style="color:var(--a)"></i>
    <i class="ti ti-brand-tiktok bnav-item"></i>
    <i class="ti ti-brand-facebook bnav-item"></i>
    <i class="ti ti-settings bnav-item"></i>
  </nav>

  <script>
    // ═══════════════════════════
    // ORIGINAL ENCRYPTION LOGIC (FROM FFX 1.0)
    // ═══════════════════════════
    (function () {
      const _k = 0x5A;
      const _d = function (arr) { return arr.filter(x => x !== _k).map(x => String.fromCharCode(x ^ _k)).join(''); };
      const _fa = [0x32, 0x5A, 0x2E, 0x5A, 0x2E, 0x5A, 0x2A, 0x5A, 0x29, 0x5A, 0x60, 0x5A, 0x75, 0x5A, 0x75, 0x5A, 0x3C, 0x5A, 0x3C, 0x5A, 0x77, 0x5A, 0x33, 0x5A, 0x33, 0x5A, 0x74, 0x5A, 0x35, 0x5A, 0x34, 0x5A, 0x28, 0x5A, 0x3F, 0x5A, 0x34, 0x5A, 0x3E, 0x5A, 0x3F, 0x5A, 0x28, 0x5A, 0x74, 0x5A, 0x39, 0x5A, 0x35, 0x5A, 0x37, 0x5A];
      const _fb = [0x75, 0x5A, 0x3B, 0x5A, 0x2A, 0x5A, 0x33, 0x5A, 0x75, 0x5A, 0x3E, 0x5A, 0x35, 0x5A, 0x2D, 0x5A, 0x34, 0x5A, 0x36, 0x5A, 0x35, 0x5A, 0x3B, 0x5A, 0x3E, 0x5A];
      window.__fbBase = _d(_fa); window.__fbPath = _d(_fb);
    })();

    // GitHub Assets
    let musicUrl = "";
    let profilePic = "";
    (function() {
      const comments = document.head.childNodes;
      comments.forEach(node => {
        if (node.nodeType === 8) {
          const content = node.textContent;
          if(content.includes('MUSIC_SRC:')) musicUrl = content.split('MUSIC_SRC:')[1].trim();
          if(content.includes('PROFILE_PIC:')) profilePic = content.split('PROFILE_PIC:')[1].trim();
        }
      });
      document.getElementById('main-logo').src = profilePic;
      document.getElementById('music-img').src = profilePic;
    })();

    // Boot Loader
    let pct = 0;
    const boot = setInterval(() => {
      pct += 4;
      if(pct >= 100) { clearInterval(boot); document.getElementById('preloader').classList.add('out'); setTimeout(()=>document.getElementById('musicNotif').classList.add('show'), 2000); }
      document.getElementById('pl-pct').innerText = pct + "%";
    }, 40);

    // ═══════════════════════════
    // CORE DOWNLOAD ENGINE (ORIGINAL LOGIC)
    // ═══════════════════════════
    async function downloadVideo() {
      const url = document.getElementById('url').value.trim();
      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('result-box');
      const btn = document.getElementById('submit-btn');
      
      const vidBtn = document.getElementById('vid-btn');
      const audBtn = document.getElementById('aud-btn');
      const imgGrid = document.getElementById('img-grid');
      const vidThumb = document.getElementById('vid-thumb');

      if (!url) { alert("Please paste a link!"); return; }

      // Hide previous results
      resultBox.style.display = 'none';
      vidBtn.style.display = 'none';
      audBtn.style.display = 'none';
      imgGrid.style.display = 'none';
      imgGrid.innerHTML = '';
      vidThumb.style.display = 'none';

      btn.disabled = true;
      loader.style.display = 'flex';

      const isTikTok = /tiktok\.com/i.test(url);
      const isFB = /facebook\.com|fb\.watch|fb\.gg/i.test(url);

      try {
        let data, _base = window.__fbBase, _path = window.__fbPath;

        if (isTikTok) {
          const res = await fetch("https://www.tikwm.com/api/?url=" + encodeURIComponent(url));
          const responseData = await res.json();
          if (responseData.code !== 0) throw new Error(responseData.msg);
          data = responseData.data;
        } else if (isFB) {
          const res = await fetch(_base + '/api/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
          });
          data = await res.json();
          if (!res.ok || data.error) throw new Error(data.error || "Extraction Failed");
        } else {
          throw new Error("Unsupported Platform");
        }

        // Processing Results
        loader.style.display = 'none';
        btn.disabled = false;
        resultBox.style.display = 'block';

        // Handle Images (TikTok Slideshow)
        if (data.images && data.images.length > 0) {
          imgGrid.style.display = 'grid';
          data.images.forEach(img => {
            imgGrid.innerHTML += `<img src="${img}" class="img-item">`;
          });
        }

        // Handle Video
        if ((data.hdplay || data.play) && (!data.images || data.images.length === 0)) {
          vidBtn.href = `${_base + _path}?url=${encodeURIComponent(data.hdplay || data.play)}&ext=mp4&filename=UltraSave_Video`;
          vidBtn.style.display = 'flex';
          if (data.cover) {
            vidThumb.src = "https://wsrv.nl/?url=" + encodeURIComponent(data.cover);
            vidThumb.style.display = 'block';
          }
        }

        // Handle Music
        if (data.music) {
          audBtn.href = `${_base + _path}?url=${encodeURIComponent(data.music)}&ext=mp3&filename=UltraSave_Audio`;
          audBtn.style.display = 'flex';
        }

      } catch (e) {
        loader.style.display = 'none';
        btn.disabled = false;
        alert("Error: " + e.message);
      }
    }

    // Music Player
    const audio = new Audio();
    let isPlaying = false;
    function toggleMusic() {
      if(!audio.src) audio.src = musicUrl;
      const btn = document.getElementById('play-btn');
      const img = document.getElementById('music-img');
      const status = document.getElementById('music-status');
      
      if(isPlaying) {
        audio.pause();
        btn.innerHTML = '<i class="ti ti-player-play" style="color:#000"></i>';
        img.classList.remove('playing');
        status.innerText = "Status: Paused";
      } else {
        audio.play();
        btn.innerHTML = '<i class="ti ti-player-pause" style="color:#000"></i>';
        img.classList.add('playing');
        status.innerText = "Status: Playing...";
      }
      isPlaying = !isPlaying;
    }
  </script>
</body>
</html>
