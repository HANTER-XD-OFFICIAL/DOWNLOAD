<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00e5ff">
  <meta name="referrer" content="no-referrer">
  <title>ULTRA-SAVE PRO | HD DOWNLOADER</title>

  <!-- 
    [ SYSTEM CONFIGURATION ]
    Update the links below using your GitHub RAW links.
  -->
  <!-- THEME_COLOR: 0, 229, 255 -->
  <!-- TIKTOK_LINK: https://www.tiktok.com/ -->
  <!-- FB_LINK: https://www.facebook.com/ -->
  <!-- MUSIC_SRC: https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/audio.mp3 -->
  <!-- PROFILE_PIC: https://cdn-icons-png.flaticon.com/512/8922/8922789.png -->
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    :root {
      --a: #00e5ff;
      --ag: rgba(0, 229, 255, 0.7);
      --ad: rgba(0, 229, 255, 0.1);
      --ab: rgba(0, 229, 255, 0.35);
      --bg0: #030407;
      --bg1: #07080f;
      --bg2: #0b0d18;
      --brd: rgba(255, 255, 255, 0.05);
      --brda: rgba(0, 229, 255, 0.28);
      --txt: #e8e8f0;
      --txm: #8888aa;
      --txd: #44445a;
      --ease: cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background: var(--bg0); color: var(--txt); overflow-x: hidden; min-height: 100vh; }
    a { text-decoration: none; color: inherit; }
    
    /* SCANLINE ANIMATION */
    .scanline { position: fixed; inset: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--ag), transparent); z-index: 9; pointer-events: none; animation: scanDown 8s linear infinite; }
    @keyframes scanDown { 0% { top: -5px; } 100% { top: 100vh; } }
    #pCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    /* SYSTEM PRELOADER */
    #preloader { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s ease; }
    #preloader.out { opacity: 0; visibility: hidden; }
    .pl-logo { font-family: 'Orbitron', sans-serif; font-size: 2.5rem; font-weight: 900; color: #fff; letter-spacing: 5px; text-transform: uppercase; }
    .pl-logo span { color: var(--a); text-shadow: 0 0 20px var(--a); }

    /* LAYOUT WRAPPER */
    .wrap { width: 100%; max-width: 430px; margin: 0 auto; padding: 20px 15px 100px; position: relative; z-index: 2; }
    .card { background: var(--bg1); border: 1px solid var(--brd); border-radius: 16px; padding: 25px 20px; margin-bottom: 15px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--a), transparent); }

    .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .logo-img { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--brda); box-shadow: 0 0 15px var(--ad); object-fit: cover; }

    /* INPUT STYLING */
    .input-wrap { position: relative; margin: 20px 0; }
    .url-input { width: 100%; padding: 15px 15px 15px 45px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--brd); color: #fff; outline: none; transition: 0.3s; font-family: 'Rajdhani'; }
    .url-input:focus { border-color: var(--a); box-shadow: 0 0 15px var(--ad); }
    .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--a); }

    /* ACTION BUTTON */
    .dl-btn { width: 100%; padding: 16px; border-radius: 10px; background: var(--a); color: #000; font-family: 'Orbitron', sans-serif; font-weight: 700; border: none; cursor: pointer; transition: 0.3s; box-shadow: 0 0 20px var(--ad); letter-spacing: 1px; }
    .dl-btn:active { transform: scale(0.98); background: #fff; }

    /* FLOATING MUSIC PLAYER */
    #musicNotif { position: fixed; bottom: 85px; left: 15px; right: 15px; background: rgba(10,12,18,0.95); border: 1px solid var(--brda); border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 12px; transform: translateY(200px); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 1000; backdrop-filter: blur(10px); }
    #musicNotif.show { transform: translateY(0); }
    .mn-img { width: 50px; height: 50px; border-radius: 12px; animation: spin 4s linear infinite paused; object-fit: cover; border: 1px solid var(--brda); }
    .mn-img.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* BOTTOM NAVIGATION */
    .bnav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,6,10,0.95); border-top: 1px solid var(--brd); display: flex; justify-content: space-around; padding: 12px; z-index: 100; backdrop-filter: blur(10px); }
    .bnav-item { color: var(--txm); font-size: 20px; cursor: pointer; transition: 0.3s; }
    .bnav-item.active { color: var(--a); text-shadow: 0 0 10px var(--a); }

    .stat-box { display: flex; justify-content: space-around; text-align: center; }
    .stat-item b { color: var(--a); display: block; font-size: 1.1rem; }
    .stat-item small { color: var(--txm); text-transform: uppercase; letter-spacing: 1px; font-size: 0.6rem; }

  </style>
</head>

<body>
  <div class="scanline"></div>
  <canvas id="pCanvas"></canvas>

  <!-- LOADING OVERLAY -->
  <div id="preloader">
    <div class="pl-logo" id="pl-name">ULTRA-<span>SAVE</span></div>
    <div style="color:var(--a); font-family:'Share Tech Mono'; margin-top:10px; letter-spacing: 2px;" id="pl-pct">0%</div>
  </div>

  <div class="wrap">
    <!-- HEADER SECTION -->
    <div class="logo-row">
      <img src="" id="main-logo" class="logo-img" alt="System Icon">
      <div style="font-family:'Orbitron'; font-weight:900; letter-spacing:2px; font-size:1.2rem;">ULTRA-<span style="color:var(--a)">SAVE</span></div>
    </div>

    <!-- MAIN DOWNLOAD CARD -->
    <div class="card">
      <div style="font-family:'Share Tech Mono'; color:var(--a); font-size:0.7rem; letter-spacing:3px; margin-bottom:10px;">// CORE_SYSTEM_READY</div>
      <h2 style="font-family:'Orbitron'; margin-bottom:10px; font-size: 1.4rem;">Media Downloader</h2>
      <p style="color:var(--txm); font-size:0.9rem; margin-bottom:20px; line-height: 1.4;">Premium tool to download TikTok and Facebook media in HD quality without watermarks.</p>
      
      <div class="input-wrap">
        <i class="ti ti-link input-icon"></i>
        <input type="text" id="url" class="url-input" placeholder="Paste media link here...">
      </div>
      
      <button class="dl-btn" onclick="processDownload()">FETCH CONTENT</button>
    </div>

    <!-- SYSTEM STATS CARD -->
    <div class="card">
       <div class="stat-box">
         <div class="stat-item"><b>ULTRA HD</b><small>Resolution</small></div>
         <div class="stat-item"><b>CLEAN</b><small>No Watermark</small></div>
         <div class="stat-item"><b>UNLIMITED</b><small>Daily Access</small></div>
       </div>
    </div>
  </div>

  <!-- FLOATING MEDIA NOTIFICATION -->
  <div id="musicNotif">
    <img src="" id="music-img" class="mn-img">
    <div style="flex:1">
      <div style="font-size:0.8rem; font-weight:bold; letter-spacing: 1px;">SYSTEM_AUDIO.EXE</div>
      <div style="font-size:0.6rem; color:var(--txm); text-transform: uppercase;" id="music-status">Status: Paused</div>
    </div>
    <button onclick="toggleMusic()" id="play-btn" style="background:var(--a); border:none; width:38px; height:38px; border-radius:50%; cursor:pointer; display: flex; align-items: center; justify-content: center;"><i class="ti ti-player-play" style="font-size: 1.2rem; color: #000;"></i></button>
  </div>

  <!-- NAVIGATION BAR -->
  <nav class="bnav">
    <i class="ti ti-smart-home bnav-item active"></i>
    <i class="ti ti-brand-tiktok bnav-item"></i>
    <i class="ti ti-brand-facebook bnav-item"></i>
    <i class="ti ti-settings-automation bnav-item"></i>
  </nav>

  <script>
    // CORE SYSTEM LOGIC
    let musicUrl = "";
    let profilePic = "";

    // FETCH CONFIG FROM COMMENTS
    (function() {
      const comments = document.head.childNodes;
      comments.forEach(node => {
        if (node.nodeType === 8) {
          const content = node.textContent;
          if(content.includes('MUSIC_SRC:')) musicUrl = content.split('MUSIC_SRC:')[1].trim();
          if(content.includes('PROFILE_PIC:')) profilePic = content.split('PROFILE_PIC:')[1].trim();
        }
      });
      // Set images from fetched config
      document.getElementById('main-logo').src = profilePic;
      document.getElementById('music-img').src = profilePic;
    })();

    // INITIALIZATION ANIMATION
    let pct = 0;
    const pctEl = document.getElementById('pl-pct');
    const loader = setInterval(() => {
      pct += Math.floor(Math.random() * 8) + 2;
      if(pct >= 100) {
        pct = 100;
        clearInterval(loader);
        document.getElementById('preloader').classList.add('out');
        setTimeout(() => document.getElementById('musicNotif').classList.add('show'), 1500);
      }
      pctEl.innerText = "INITIALIZING: " + pct + "%";
    }, 80);

    // AUDIO CONTROL SYSTEM
    const audio = new Audio();
    let isPlaying = false;
    function toggleMusic() {
      const btn = document.getElementById('play-btn');
      const img = document.getElementById('music-img');
      const status = document.getElementById('music-status');
      
      if(!audio.src) audio.src = musicUrl;

      if(isPlaying) {
        audio.pause();
        btn.innerHTML = '<i class="ti ti-player-play" style="color:#000"></i>';
        img.classList.remove('playing');
        status.innerText = "Status: Paused";
      } else {
        audio.play();
        btn.innerHTML = '<i class="ti ti-player-pause" style="color:#000"></i>';
        img.classList.add('playing');
        status.innerText = "Status: Playing...";
      }
      isPlaying = !isPlaying;
    }

    // AMBIENT BACKGROUND PARTICLES
    const canvas = document.getElementById('pCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    function drawParticles() {
      ctx.clearRect(0,0,canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0, 229, 255, 0.05)";
      for(let i=0; i<40; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 0.8, 0, Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    function processDownload() {
      const url = document.getElementById('url').value;
      if(!url) {
        alert("Please enter a valid URL!");
        return;
      }
      alert("System: Analyzing link... Accessing API servers.");
    }
  </script>
</body>

</html>
