<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ULTRA-SAVE PRO | HANTER-XD</title>
  
  <!-- [ GITHUB CONFIG ] -->
  <!-- MUSIC_SRC: https://raw.githubusercontent.com/HANTER-XD-OFFICIAL/DOWNLOAD/main/bg-music.mp3 -->
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    :root {
      --primary: #00f7ff;
      --accent: #ff007b;
      --bg: #020205;
      --card: rgba(10, 15, 25, 0.95);
      --brd: rgba(0, 247, 255, 0.3);
    }

    body { 
      background: var(--bg); color: #fff; font-family: 'Rajdhani', sans-serif; 
      margin: 0; min-height: 100vh; overflow-x: hidden;
    }

    /* CUSTOM VIP LOGO SVG */
    .logo-container {
      width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
      background: rgba(0, 247, 255, 0.1); border: 2px solid var(--primary);
      border-radius: 12px; box-shadow: 0 0 20px var(--brd);
    }

    /* HEADER */
    .header {
      max-width: 450px; margin: 0 auto; padding: 20px 15px;
      display: flex; align-items: center; gap: 15px; border-bottom: 1px solid var(--brd);
    }

    .dev-meta { flex: 1; }
    .dev-meta h1 { font-family: 'Orbitron'; font-size: 0.85rem; margin: 0; letter-spacing: 1px; }
    .badge { font-size: 0.55rem; background: var(--primary); padding: 2px 8px; border-radius: 4px; color: #000; font-weight: 900; }

    /* CONTAINER */
    .container { max-width: 450px; margin: 25px auto; padding: 0 15px; position: relative; z-index: 2; }
    
    .card {
      background: var(--card); backdrop-filter: blur(25px);
      border: 1px solid var(--brd); border-radius: 25px; padding: 30px 20px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.9);
    }

    /* INPUT FIELD */
    .input-wrap { position: relative; margin: 25px 0; }
    .input-wrap i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); font-size: 1.2rem; }
    .url-input {
      width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.6);
      border: 1px solid var(--brd); padding: 18px 15px 18px 50px;
      border-radius: 15px; color: #fff; font-family: 'Rajdhani'; font-size: 1rem; outline: none;
    }

    .btn {
      width: 100%; padding: 18px; border-radius: 15px; border: none;
      background: var(--primary); color: #000; font-family: 'Orbitron';
      font-weight: 900; cursor: pointer; transition: 0.3s; letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(0, 247, 255, 0.4);
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* RESULTS AREA */
    #result-box { display: none; margin-top: 30px; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

    .thumb-preview {
      width: 100%; border-radius: 20px; border: 1px solid var(--brd);
      margin-bottom: 20px; box-shadow: 0 0 30px rgba(0, 247, 255, 0.15);
      background: #000; min-height: 150px; object-fit: cover;
    }

    .dl-btn {
      display: flex; align-items: center; gap: 12px; background: rgba(0, 247, 255, 0.08);
      border: 1px solid var(--brd); padding: 15px; border-radius: 15px;
      color: #fff; text-decoration: none; margin-bottom: 12px; transition: 0.3s;
    }
    .dl-btn:hover { background: var(--primary); color: #000; transform: scale(1.02); }
    .dl-btn i { font-size: 1.3rem; }

    /* MUSIC PLAYER */
    .music-orb {
      position: fixed; bottom: 85px; left: 20px; right: 20px;
      background: rgba(5, 5, 10, 0.9); border: 1px solid var(--brd);
      border-radius: 60px; padding: 12px 20px; display: flex; align-items: center; gap: 15px;
      backdrop-filter: blur(20px); transform: translateY(200px); transition: 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .music-orb.active { transform: translateY(0); }

    .disc-box {
      width: 45px; height: 45px; background: var(--primary); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: spin 5s linear infinite paused; border: 2px solid #000;
    }
    .disc-box.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* STATUS TEXT */
    .status-text {
      text-align: center; font-family: 'Share Tech Mono'; color: var(--primary);
      font-size: 0.75rem; margin-top: 15px; display: none;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00f7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="8 12 12 16 16 12"/><line x1="12" y1="8" x2="12" y2="16"/>
      </svg>
    </div>
    <div class="dev-meta">
      <h1>HANTER-XD OFFICIAL</h1>
      <span class="badge">CORE V2.1 PREMIUM</span>
    </div>
    <i class="ti ti-access-point" style="color:var(--primary); font-size: 1.5rem;"></i>
  </header>

  <div class="container">
    <div class="card">
      <div style="font-family:'Share Tech Mono'; color:var(--primary); font-size:0.7rem; letter-spacing: 2px;">// SYSTEM_STATUS: ONLINE</div>
      <h2 style="font-family:'Orbitron'; font-size:1.3rem; margin: 15px 0 5px;">ULTRA-SAVE PRO</h2>
      <p style="font-size:0.85rem; color:#888; margin-bottom:20px;">Download TikTok & Facebook Content in Original Quality</p>

      <div class="input-wrap">
        <i class="ti ti-link"></i>
        <input type="text" id="url-field" class="url-input" placeholder="Paste Video Link Here...">
      </div>

      <button class="btn" id="dl-btn" onclick="executeProcess()">START EXTRACTION</button>
      
      <div id="status" class="status-text">INITIALIZING REMOTE CONNECTION...</div>

      <div id="result-box">
        <img id="vid-cover" class="thumb-preview" src="">
        <div id="download-links"></div>
      </div>
    </div>
  </div>

  <!-- VIP AUDIO STREAM -->
  <div class="music-orb" id="music-player">
    <div class="disc-box" id="disc">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div style="flex:1">
      <div style="font-family:'Orbitron'; font-size:0.55rem; color:var(--primary); letter-spacing: 1px;">HANTER_AUDIO_CORE</div>
      <div style="font-size:0.65rem; color:#888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Premium Background Streaming...</div>
    </div>
    <button onclick="controlMusic()" style="background:var(--primary); border:none; width:40px; height:40px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;">
      <i class="ti ti-player-play" id="m-icon" style="color:#000; font-size: 1.2rem;"></i>
    </button>
  </div>

  <script>
    // ═══════════════════════════
    // CORE DECRYPTION (FFX 1.0 LOGIC)
    // ═══════════════════════════
    (function () {
      const _k = 0x5A;
      const _d = function (arr) { return arr.filter(x => x !== _k).map(x => String.fromCharCode(x ^ _k)).join(''); };
      const _fa = [0x32, 0x5A, 0x2E, 0x5A, 0x2E, 0x5A, 0x2A, 0x5A, 0x29, 0x5A, 0x60, 0x5A, 0x75, 0x5A, 0x75, 0x5A, 0x3C, 0x5A, 0x3C, 0x5A, 0x77, 0x5A, 0x33, 0x5A, 0x33, 0x5A, 0x74, 0x5A, 0x35, 0x5A, 0x34, 0x5A, 0x28, 0x5A, 0x3F, 0x5A, 0x34, 0x5A, 0x3E, 0x5A, 0x3F, 0x5A, 0x28, 0x5A, 0x74, 0x5A, 0x39, 0x5A, 0x35, 0x5A, 0x37, 0x5A];
      const _fb = [0x75, 0x5A, 0x3B, 0x5A, 0x2A, 0x5A, 0x33, 0x5A, 0x75, 0x5A, 0x3E, 0x5A, 0x35, 0x5A, 0x2D, 0x5A, 0x34, 0x5A, 0x36, 0x5A, 0x35, 0x5A, 0x3B, 0x5A, 0x3E, 0x5A];
      window.__fbBase = _d(_fa); window.__fbPath = _d(_fb);
    })();

    // AUDIO LOGIC
    const audioStream = new Audio("https://raw.githubusercontent.com/HANTER-XD-OFFICIAL/DOWNLOAD/main/bg-music.mp3");
    let playState = false;

    setTimeout(() => { document.getElementById('music-player').classList.add('active'); }, 1500);

    function controlMusic() {
      const icon = document.getElementById('m-icon');
      const disc = document.getElementById('disc');
      if(playState) {
        audioStream.pause();
        icon.className = "ti ti-player-play";
        disc.classList.remove('playing');
      } else {
        audioStream.play();
        icon.className = "ti ti-player-pause";
        disc.classList.add('playing');
      }
      playState = !playState;
    }

    // MAIN EXTRACTION PROCESS
    async function executeProcess() {
      const inputUrl = document.getElementById('url-field').value.trim();
      const btn = document.getElementById('dl-btn');
      const statusText = document.getElementById('status');
      const resultBox = document.getElementById('result-box');
      const linksContainer = document.getElementById('download-links');
      const coverImg = document.getElementById('vid-cover');

      if(!inputUrl) return;
      
      btn.disabled = true;
      statusText.innerText = "ACCESSING API NODES...";
      statusText.style.display = "block";
      resultBox.style.display = "none";
      linksContainer.innerHTML = "";

      try {
        const isTikTok = /tiktok\.com/i.test(inputUrl);
        const isFB = /facebook\.com|fb\.watch|fb\.gg/i.test(inputUrl);
        
        let apiEndpoint = "";
        let finalData;

        if(isTikTok) {
          statusText.innerText = "BYPASSING TIKTOK SECURITY...";
          apiEndpoint = `https://www.tikwm.com/api/?url=${encodeURIComponent(inputUrl)}`;
          const response = await fetch(apiEndpoint);
          finalData = (await response.json()).data;
          
          if(!finalData) throw new Error();

          coverImg.src = finalData.cover;
          linksContainer.innerHTML = `
            <a href="${finalData.play}" class="dl-btn" target="_blank"><i class="ti ti-video"></i> DOWNLOAD VIDEO (HD)</a>
            <a href="${finalData.music}" class="dl-btn" target="_blank"><i class="ti ti-music"></i> DOWNLOAD AUDIO (MP3)</a>
          `;
        } 
        else if(isFB) {
          statusText.innerText = "SCANNING FACEBOOK SERVERS...";
          apiEndpoint = window.__fbBase + '/api/download';
          const fbResponse = await fetch(apiEndpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: inputUrl })
          });
          finalData = await fbResponse.json();

          if(finalData.error || !finalData) throw new Error();

          coverImg.src = finalData.cover || "https://via.placeholder.com/400x200/020205/00f7ff?text=Facebook+Video+Ready";
          
          const dlUrl = finalData.hdplay || finalData.play;
          linksContainer.innerHTML = `
            <a href="${window.__fbBase + window.__fbPath}?url=${encodeURIComponent(dlUrl)}&ext=mp4&filename=Hanter_FB_Video" class="dl-btn" target="_blank"><i class="ti ti-video"></i> DOWNLOAD HD VIDEO</a>
          `;
        } else {
          statusText.innerText = "ERROR: UNSUPPORTED PLATFORM";
          btn.disabled = false;
          return;
        }

        statusText.style.display = "none";
        resultBox.style.display = "block";

      } catch (e) {
        statusText.innerText = "SYSTEM ERROR: LINK IS PRIVATE OR DEAD";
        setTimeout(() => { statusText.style.display = "none"; }, 3000);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
