<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniSave - Universal Video Downloader</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root {
      --primary: #ff0055;
      --bg: #0b0f19;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .wrapper { width: 100%; max-width: 480px; background: var(--card-bg); padding: 30px 20px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
    .logo { text-align: center; font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 5px; }
    .subtitle { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 25px; }
    .input-group { position: relative; margin-bottom: 15px; }
    .url-input { width: 100%; padding: 14px 15px 14px 45px; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: var(--text); font-size: 0.95rem; outline: none; transition: 0.3s; }
    .url-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,0,85,0.3); }
    .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--primary); font-size: 20px; }
    .dl-btn { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(255,0,85,0.4); }
    .dl-btn:hover { opacity: 0.9; transform: translateY(-2px); }
    .platforms { display: flex; justify-content: space-around; margin-top: 20px; font-size: 24px; color: var(--text-muted); }
    .platforms i { transition: 0.3s; }
    .platforms i:hover { color: var(--primary); }
    
    /* Result Section */
    #result-box { display: none; margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
    .media-link { display: block; margin-top: 10px; padding: 12px; background: var(--primary); color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
    .loader { display: none; width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 15px auto 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { color: #ff4466; font-size: 0.85rem; margin-top: 10px; display: none; }
  </style>
</head>
<body>

<div class="wrapper">
    <div class="logo">OmniSave</div>
    <div class="subtitle">Download Video from TikTok, FB, Instagram & YouTube</div>

    <div class="input-group">
        <i class="ti ti-link input-icon"></i>
        <input type="text" id="urlInput" class="url-input" placeholder="Paste video link here...">
    </div>

    <button class="dl-btn" onclick="fetchMedia()">Download Now</button>

    <div class="loader" id="loader"></div>
    <div class="error-msg" id="errorMsg"></div>

    <div id="result-box">
        <p style="font-size: 0.9rem; margin-bottom: 8px; color: var(--text-muted);">Ready for Download:</p>
        <a id="downloadLink" href="#" target="_blank" class="media-link"><i class="ti ti-download"></i> Download HD Video</a>
    </div>

    <div class="platforms" style="margin-top: 25px;">
        <i class="ti ti-brand-tiktok"></i>
        <i class="ti ti-brand-facebook"></i>
        <i class="ti ti-brand-instagram"></i>
        <i class="ti ti-brand-youtube"></i>
    </div>
</div>

<script>
    async function fetchMedia() {
        const url = document.getElementById('urlInput').value.trim();
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('result-box');
        const downloadLink = document.getElementById('downloadLink');

        errorMsg.style.display = 'none';
        resultBox.style.display = 'none';

        if (!url) {
            errorMsg.innerText = "Please paste a valid link!";
            errorMsg.style.display = 'block';
            return;
        }

        loader.style.display = 'block';

        try {
            // যদি লিংকটি TikTok এর হয় তবে tikwm এপিআই ব্যবহার করবে
            if (url.includes('tiktok.com')) {
                const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                if (data.code === 0) {
                    downloadLink.href = data.data.play;
                    resultBox.style.display = 'block';
                } else {
                    throw new Error("Failed to fetch TikTok video.");
                }
            } else {
                // অন্যান্য প্ল্যাটফর্মের (Facebook, Instagram, YouTube) জন্য ফ্রি অল-ইন-ওয়ান পাবলিক এপিআই বা সেবা ব্যবহার করতে পারেন
                // এখানে একটি জেনারেল নোটিফিকেশন বা এপিআই ইন্টিগ্রেশন রাখা হলো
                throw new Error("Currently, direct fetching for this platform requires a backend token. Use TikTok link for instant download.");
            }
        } catch (err) {
            errorMsg.innerText = err.message || "Something went wrong!";
            errorMsg.style.display = 'block';
        } finally {
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
