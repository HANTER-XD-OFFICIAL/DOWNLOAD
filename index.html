<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00e5ff">
  <meta name="referrer" content="no-referrer">
  <title>ULTRA-SAVE PRO | HD DOWNLOADER</title>

  <!-- 
    [ SYSTEM CONFIGURATION ]
    Update the links below using your GitHub RAW links.
  -->
  <!-- THEME_COLOR: 0, 229, 255 -->
  <!-- TIKTOK_LINK: https://www.tiktok.com/ -->
  <!-- FB_LINK: https://www.facebook.com/ -->
  <!-- MUSIC_SRC: https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/audio.mp3 -->
  <!-- PROFILE_PIC: https://cdn-icons-png.flaticon.com/512/8922/8922789.png -->
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  
  <style>
    :root {
      --a: #00e5ff;
      --ag: rgba(0, 229, 255, 0.7);
      --ad: rgba(0, 229, 255, 0.1);
      --ab: rgba(0, 229, 255, 0.35);
      --bg0: #030407;
      --bg1: #07080f;
      --bg2: #0b0d18;
      --brd: rgba(255, 255, 255, 0.05);
      --brda: rgba(0, 229, 255, 0.28);
      --txt: #e8e8f0;
      --txm: #8888aa;
      --txd: #44445a;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Rajdhani', sans-serif; background: var(--bg0); color: var(--txt); overflow-x: hidden; min-height: 100vh; }
    
    /* SCANLINE */
    .scanline { position: fixed; inset: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--ag), transparent); z-index: 9; pointer-events: none; animation: scanDown 8s linear infinite; }
    @keyframes scanDown { 0% { top: -5px; } 100% { top: 100vh; } }
    #pCanvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

    #preloader { position: fixed; inset: 0; background: #000; z-index: 99999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.8s ease; }
    #preloader.out { opacity: 0; visibility: hidden; }

    .wrap { width: 100%; max-width: 430px; margin: 0 auto; padding: 20px 15px 100px; position: relative; z-index: 2; }
    .card { background: var(--bg1); border: 1px solid var(--brd); border-radius: 16px; padding: 25px 20px; margin-bottom: 15px; position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--a), transparent); }

    .logo-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .logo-img { width: 45px; height: 45px; border-radius: 12px; border: 1px solid var(--brda); object-fit: cover; }

    .input-wrap { position: relative; margin: 20px 0; }
    .url-input { width: 100%; padding: 15px 15px 15px 45px; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--brd); color: #fff; outline: none; transition: 0.3s; font-family: 'Rajdhani'; }
    .url-input:focus { border-color: var(--a); box-shadow: 0 0 15px var(--ad); }
    .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--a); }

    .dl-btn { width: 100%; padding: 16px; border-radius: 10px; background: var(--a); color: #000; font-family: 'Orbitron', sans-serif; font-weight: 700; border: none; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
    .dl-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* RESULTS AREA */
    #result-box { display: none; margin-top: 20px; border-top: 1px solid var(--brd); padding-top: 20px; }
    .media-preview { width: 100%; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--brda); }
    .download-link { display: flex; align-items: center; gap: 10px; background: var(--ad); border: 1px solid var(--brda); padding: 12px; border-radius: 10px; color: var(--a); text-decoration: none; margin-bottom: 10px; font-weight: bold; transition: 0.3s; }
    .download-link:hover { background: var(--a); color: #000; }

    /* STATUS BOX */
    .status-msg { display: none; margin-top: 15px; font-size: 0.8rem; font-family: 'Share Tech Mono'; text-align: center; color: var(--a); }

    /* MUSIC PLAYER */
    #musicNotif { position: fixed; bottom: 85px; left: 15px; right: 15px; background: rgba(10,12,18,0.95); border: 1px solid var(--brda); border-radius: 20px; padding: 15px; display: flex; align-items: center; gap: 12px; transform: translateY(200px); transition: 0.5s; z-index: 1000; backdrop-filter: blur(10px); }
    #musicNotif.show { transform: translateY(0); }
    .mn-img { width: 50px; height: 50px; border-radius: 12px; animation: spin 4s linear infinite paused; border: 1px solid var(--brda); }
    .mn-img.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .bnav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5,6,10,0.95); border-top: 1px solid var(--brd); display: flex; justify-content: space-around; padding: 12px; z-index: 100; }
    .bnav-item { color: var(--txm); font-size: 20px; }
  </style>
</head>

<body>
  <div class="scanline"></div>
  <canvas id="pCanvas"></canvas>

  <div id="preloader">
    <div class="pl-logo">ULTRA-<span>SAVE</span></div>
    <div style="color:var(--a); font-family:'Share Tech Mono'; margin-top:10px;" id="pl-pct">0%</div>
  </div>

  <div class="wrap">
    <div class="logo-row">
      <img src="" id="main-logo" class="logo-img" alt="Icon">
      <div style="font-family:'Orbitron'; font-weight:900; letter-spacing:2px; font-size:1.2rem;">ULTRA-<span style="color:var(--a)">SAVE</span></div>
    </div>

    <div class="card">
      <div style="font-family:'Share Tech Mono'; color:var(--a); font-size:0.7rem; letter-spacing:3px; margin-bottom:10px;">// SYSTEM_READY</div>
      <h2 style="font-family:'Orbitron'; margin-bottom:10px; font-size: 1.4rem;">Media Downloader</h2>
      
      <div class="input-wrap">
        <i class="ti ti-link input-icon"></i>
        <input type="text" id="url" class="url-input" placeholder="Paste TikTok/FB link here...">
      </div>
      
      <button class="dl-btn" id="dl-btn" onclick="processDownload()">FETCH CONTENT</button>
      
      <div id="status" class="status-msg">PROCESSING...</div>

      <!-- Result Box -->
      <div id="result-box">
        <img id="preview-img" class="media-preview" src="">
        <a id="video-link" class="download-link" href="#" target="_blank"><i class="ti ti-video"></i> DOWNLOAD VIDEO (HD)</a>
        <a id="audio-link" class="download-link" href="#" target="_blank"><i class="ti ti-music"></i> DOWNLOAD AUDIO (MP3)</a>
      </div>
    </div>
  </div>

  <div id="musicNotif">
    <img src="" id="music-img" class="mn-img">
    <div style="flex:1">
      <div style="font-size:0.8rem; font-weight:bold;">SYSTEM_AUDIO.EXE</div>
      <div style="font-size:0.6rem; color:var(--txm);" id="music-status">Status: Paused</div>
    </div>
    <button onclick="toggleMusic()" id="play-btn" style="background:var(--a); border:none; width:38px; height:38px; border-radius:50%;"><i class="ti ti-player-play"></i></button>
  </div>

  <nav class="bnav">
    <i class="ti ti-smart-home bnav-item" style="color:var(--a)"></i>
    <i class="ti ti-brand-tiktok bnav-item"></i>
    <i class="ti ti-brand-facebook bnav-item"></i>
    <i class="ti ti-settings bnav-item"></i>
  </nav>

  <script>
    let musicUrl = "";
    let profilePic = "";

    // Config initialization
    (function() {
      const comments = document.head.childNodes;
      comments.forEach(node => {
        if (node.nodeType === 8) {
          const content = node.textContent;
          if(content.includes('MUSIC_SRC:')) musicUrl = content.split('MUSIC_SRC:')[1].trim();
          if(content.includes('PROFILE_PIC:')) profilePic = content.split('PROFILE_PIC:')[1].trim();
        }
      });
      document.getElementById('main-logo').src = profilePic;
      document.getElementById('music-img').src = profilePic;
    })();

    // Preloader
    let pct = 0;
    const loader = setInterval(() => {
      pct += 5;
      if(pct >= 100) {
        clearInterval(loader);
        document.getElementById('preloader').classList.add('out');
        setTimeout(() => document.getElementById('musicNotif').classList.add('show'), 1500);
      }
      document.getElementById('pl-pct').innerText = "LOAD: " + pct + "%";
    }, 50);

    // Download Engine
    async function processDownload() {
      const urlInput = document.getElementById('url').value;
      const btn = document.getElementById('dl-btn');
      const status = document.getElementById('status');
      const resultBox = document.getElementById('result-box');

      if (!urlInput) { alert("Please paste a link first!"); return; }

      btn.disabled = true;
      status.style.display = "block";
      resultBox.style.display = "none";

      try {
        // TikTok API (Example using TikWM)
        const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
        const resData = await response.json();

        if (resData.code === 0) {
          const data = resData.data;
          document.getElementById('preview-img').src = data.cover;
          document.getElementById('video-link').href = data.play;
          document.getElementById('audio-link').href = data.music;
          
          status.style.display = "none";
          resultBox.style.display = "block";
        } else {
          // If TikTok API fails, check for FB or show error
          status.innerText = "ERROR: LINK NOT SUPPORTED OR PRIVATE";
        }
      } catch (err) {
        status.innerText = "SYSTEM ERROR: API UNREACHABLE";
      } finally {
        btn.disabled = false;
      }
    }

    // Music
    const audio = new Audio();
    let isPlaying = false;
    function toggleMusic() {
      if(!audio.src) audio.src = musicUrl;
      if(isPlaying) {
        audio.pause();
        document.getElementById('play-btn').innerHTML = '<i class="ti ti-player-play"></i>';
        document.getElementById('music-img').classList.remove('playing');
      } else {
        audio.play();
        document.getElementById('play-btn').innerHTML = '<i class="ti ti-player-pause"></i>';
        document.getElementById('music-img').classList.add('playing');
      }
      isPlaying = !isPlaying;
    }

    // Particles
    const canvas = document.getElementById('pCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    function draw() {
      ctx.clearRect(0,0,canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0, 229, 255, 0.05)";
      for(let i=0; i<30; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1, 0, Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
