<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault | Universal Downloader</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            padding: 2rem;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 { margin-bottom: 1.5rem; color: #38bdf8; }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #334155;
            color: white;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background: #7dd3fc; }

        #result { margin-top: 20px; padding: 10px; background: #1e293b; border-radius: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>StreamVault</h1>
    <input type="text" id="urlInput" placeholder="Paste link here (TikTok, FB)...">
    <button onclick="download()">Get Download Link</button>
    <div id="result"></div>
</div>

<script>
    async function download() {
        const url = document.getElementById('urlInput').value;
        const resultDiv = document.getElementById('result');
        
        if (!url) return alert('Please enter a link');

        resultDiv.style.display = 'block';
        resultDiv.innerHTML = 'Fetching...';

        try {
            // TikTok API Example
            const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if (data.code === 0) {
                resultDiv.innerHTML = `<a href="${data.data.play}" target="_blank" style="color:#38bdf8">Download Video</a>`;
            } else {
                resultDiv.innerHTML = 'Sorry, could not fetch the video.';
            }
        } catch (error) {
            resultDiv.innerHTML = 'Error fetching link.';
        }
    }
</script>

</body>
</html>
